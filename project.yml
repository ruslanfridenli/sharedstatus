name: sharedstatus
options:
  bundleIdPrefix: com.sharedstatus
targets:
  sharedstatusapp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
      - Shared
    entitlements:
      path: App/sharedstatusapp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sharedstatus.app
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.sharedstatus.app
        INFOPLIST_KEY_CFBundleDisplayName: sharedstatus
    dependencies:
      - target: statuswidgetextension

  statuswidgetextension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Widget
      - Shared
    entitlements:
      path: Widget/statuswidgetextension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sharedstatus.app
    settings:
      base:
        INFOPLIST_FILE: Widget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.sharedstatus.app.widget
        INFOPLIST_KEY_CFBundleDisplayName: sharedstatus
